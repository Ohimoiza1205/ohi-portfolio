# Netlify build configuration
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: client-side routes (/writing/my-post) must serve index.html
# instead of 404ing on direct load or refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
